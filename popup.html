<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Turbo Video Downloader</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 420px;
        min-height: 160px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 8px;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        flex: 1;
      }
      #page {
        padding: 0 14px 8px;
      }
      #list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 10px 10px;
        max-height: 420px;
        overflow-y: auto;
      }
      .item {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 9px 10px;
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr) auto;
        grid-template-areas:
          'thumb name name'
          'thumb meta actions'
          'opts opts opts'
          'note note note';
        gap: 6px 8px;
        align-items: center;
      }
      .item .thumb {
        grid-area: thumb;
        width: 64px;
        height: 40px;
        border-radius: 6px;
        background: #0d0e11;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .item .thumb:empty::after {
        content: '▶';
        color: #3a3e49;
        font-size: 15px;
      }
      .item .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .item .fname {
        grid-area: name;
        min-width: 0;
        font-weight: 600;
        background: transparent;
        border-color: transparent;
        padding: 2px 6px;
        margin-left: -6px;
      }
      .item .fname:hover,
      .item .fname:focus {
        border-color: var(--border);
        background: var(--panel-2);
        outline: none;
      }
      .item .meta {
        grid-area: meta;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        min-width: 0;
      }
      .item .meta .src {
        max-width: 150px;
      }
      .item .actions {
        grid-area: actions;
        display: flex;
        gap: 6px;
        align-items: center;
        justify-self: end;
      }

      .item .note {
        grid-area: note;
        font-size: 12px;
        color: var(--warn);
      }
      .empty {
        text-align: center;
        padding: 26px 18px;
        color: var(--muted);
      }
      .empty b {
        color: var(--text);
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 10px 14px 14px;
        border-top: 1px solid var(--border);
      }
      footer .spacer {
        flex: 1;
      }
      .item .opts {
        grid-area: opts;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 0;
      }
      .item .opts:empty {
        display: none;
      }
      .item .opts select {
        flex: 1 1 150px;
        min-width: 0;
        max-width: 100%;
      }
      .badge.live {
        background: #4d2326;
        color: #ffb3b9;
      }
      .earlier > summary {
        cursor: pointer;
        user-select: none;
        color: var(--muted);
        padding: 4px 2px;
      }
      .earlier > .item {
        margin-top: 8px;
        opacity: 0.85;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 60px;
        transform: translateX(-50%);
        background: #2b2f3a;
        border: 1px solid var(--border);
        padding: 7px 12px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <img class="logo" src="icons/icon32.png" alt="" />
      <h1>Turbo Video Downloader</h1>
    </header>
    <div id="page" class="muted ellipsis"></div>
    <div id="list"></div>
    <footer>
      <button id="open-manager">Download manager</button>
      <span class="spacer"></span>
      <button id="clear" class="ghost" title="Clear the list of detected videos for this tab">Clear</button>
    </footer>
    <div id="toast"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
