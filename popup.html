<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Turbo Video Downloader</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 420px;
        min-height: 160px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 8px;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        flex: 1;
      }
      #page {
        padding: 0 14px 8px;
      }
      #list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0 10px 10px;
        max-height: 420px;
        overflow-y: auto;
      }
      .item {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 9px 10px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 8px;
        align-items: center;
      }
      .item .name {
        font-weight: 600;
      }
      .item .meta {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
      }
      .item .actions {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .item select {
        max-width: 190px;
      }
      .item .note {
        grid-column: 1 / -1;
        font-size: 12px;
        color: var(--warn);
      }
      .empty {
        text-align: center;
        padding: 26px 18px;
        color: var(--muted);
      }
      .empty b {
        color: var(--text);
      }
      footer {
        display: flex;
        gap: 8px;
        padding: 10px 14px 14px;
        border-top: 1px solid var(--border);
      }
      footer .spacer {
        flex: 1;
      }
      .earlier > summary {
        cursor: pointer;
        user-select: none;
        color: var(--muted);
        padding: 4px 2px;
      }
      .earlier > .item {
        margin-top: 8px;
        opacity: 0.85;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 60px;
        transform: translateX(-50%);
        background: #2b2f3a;
        border: 1px solid var(--border);
        padding: 7px 12px;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <img class="logo" src="icons/icon32.png" alt="" />
      <h1>Turbo Video Downloader</h1>
    </header>
    <div id="page" class="muted ellipsis"></div>
    <div id="list"></div>
    <footer>
      <button id="open-manager">Menedżer pobierania</button>
      <span class="spacer"></span>
      <button id="clear" class="ghost" title="Wyczyść listę wykrytych filmów dla tej karty">Wyczyść</button>
    </footer>
    <div id="toast"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
