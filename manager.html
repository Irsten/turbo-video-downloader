<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="managerTitle">Download manager – Turbo Video Downloader</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="ui.css" />
    <style>
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px 16px 60px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
      }
      .logo {
        width: 28px;
        height: 28px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 14px;
        margin-bottom: 14px;
      }
      .settings {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
        align-items: center;
      }
      .settings label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .settings input[type='number'] {
        width: 64px;
      }
      .add {
        display: flex;
        gap: 8px;
      }
      .add input {
        flex: 1;
        min-width: 0;
      }
      #jobs {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .job {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
      }
      .job .top {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .job .title {
        flex: 1;
        min-width: 0;
        font-weight: 600;
      }
      .job .status {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
      }
      .job.done .status {
        color: var(--ok);
      }
      .job.error .status {
        color: var(--err);
      }
      .bar {
        height: 8px;
        background: var(--panel-2);
        border-radius: 99px;
        overflow: hidden;
        margin: 10px 0 8px;
      }
      .bar > div {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 0.25s;
      }
      .bar.indeterminate > div {
        width: 30%;
        animation: slide 1.2s infinite ease-in-out;
      }
      .job.done .bar > div {
        background: var(--ok);
      }
      .job.error .bar > div {
        background: var(--err);
      }
      @keyframes slide {
        0% {
          margin-left: -30%;
        }
        100% {
          margin-left: 100%;
        }
      }
      .stats {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .stats b {
        color: var(--text);
        font-weight: 600;
      }
      .settings .template {
        flex-basis: 100%;
      }
      .settings .template input {
        width: 260px;
      }
      #history {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .entry {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 7px 10px;
        border-radius: 8px;
      }
      .entry:hover {
        background: var(--panel);
      }
      .entry .name {
        flex: 1;
        min-width: 0;
      }
      .entry .when {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .entry button {
        padding: 3px 8px;
        font-size: 12px;
      }
      #history .empty {
        padding: 14px;
      }
      .settings .note {
        flex-basis: 100%;
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      .job.paused .status,
      .job.interrupted .status,
      .job.unsaved .status {
        color: var(--warn);
      }
      .job.recording .status {
        color: var(--accent);
        font-weight: 600;
      }
      .job.recording .bar > div {
        background: var(--accent);
      }
      .job .buttons {
        display: flex;
        gap: 6px;
      }
      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: var(--warn);
      }
      .hint code {
        display: block;
        margin-top: 4px;
        padding: 6px 8px;
        background: #111215;
        border-radius: 6px;
        color: #d6d9e0;
        user-select: all;
        overflow-x: auto;
        white-space: nowrap;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 30px;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 18px 0 10px;
      }
      .toolbar h2 {
        font-size: 14px;
        margin: 0;
      }
      /* panel of an external helper program (personal build) */
      .helper summary {
        cursor: pointer;
        font-weight: 600;
      }
      .helper p {
        margin: 8px 0 4px;
        font-size: 13px;
      }
      .helper p.ok {
        color: var(--ok);
      }
      .helper p.warn {
        color: var(--warn);
      }
      .helper code {
        display: block;
        padding: 6px 8px;
        background: #111215;
        border-radius: 6px;
        color: #d6d9e0;
        user-select: all;
        overflow-x: auto;
        white-space: nowrap;
      }
      .helper button {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="icons/icon48.png" alt="" />
        <h1 data-i18n="managerButton">Download manager</h1>
      </header>

      <section class="panel settings" id="settings">
        <label data-i18n-title="settingConnectionsTitle" title="How many parallel HTTP connections per file (MP4/WebM). For HTTP/1.1 servers Chromium-based browsers open at most 6 connections per host.">
          <span data-i18n="settingConnections">Connections per file</span> <input type="number" id="connections" min="1" max="16" />
        </label>
        <label data-i18n-title="settingSegmentsTitle" title="How many HLS/DASH segments to download at the same time">
          <span data-i18n="settingSegments">Segments at once</span> <input type="number" id="hlsConcurrency" min="1" max="32" />
        </label>
        <label data-i18n-title="settingParallelTitle" title="How many videos to download at the same time (live recordings don't count towards the limit)">
          <span data-i18n="settingParallel">Downloads at once</span> <input type="number" id="maxParallel" min="1" max="6" />
        </label>
        <label data-i18n-title="settingMp4Title" title="Video, audio and HLS/DASH segments are put together into one .mp4 file – no re-encoding, no quality loss">
          <input type="checkbox" id="mp4" /> <span data-i18n="settingMp4">Merge into one MP4 file</span>
        </label>
        <label><input type="checkbox" id="saveAs" /> <span data-i18n="settingSaveAs">Ask where to save</span></label>
        <label data-i18n-title="settingNotifyTitle" title="Notification when a download finishes or fails while this tab is in the background">
          <input type="checkbox" id="notify" /> <span data-i18n="settingNotify">Notifications</span>
        </label>
        <label class="template">
          <span data-i18n="settingFileName">File name</span> <input type="text" id="template" spellcheck="false" />
          <span class="muted" id="template-preview"></span>
        </label>
        <p class="note" data-i18n="diskNote">
          Downloaded data goes straight to disk. If you close this tab or restart the browser,
          downloads resume when you open the manager again.
        </p>
      </section>

      <form class="panel add" id="add-form">
        <input type="url" id="add-url" data-i18n-placeholder="addPlaceholder" placeholder="Paste a link to a video file (.mp4, .webm…), an .m3u8 playlist or an .mpd manifest" required />
        <button class="primary" type="submit" data-i18n="download">⚡ Download</button>
      </form>
      <div id="extras"></div>

      <div class="toolbar">
        <h2 data-i18n="downloadsHeading">Downloads</h2>
        <button id="clear-finished" class="ghost" data-i18n="removeFinished">Remove finished</button>
      </div>
      <div id="jobs"></div>

      <div class="toolbar">
        <h2 data-i18n="historyHeading">History</h2>
        <button id="clear-history" class="ghost" data-i18n="clearHistory">Clear history</button>
      </div>
      <div id="history"></div>
    </main>
    <script type="module" src="manager.js"></script>
  </body>
</html>
